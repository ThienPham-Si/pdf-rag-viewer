[project]
name = "document-intelligence-backend"
version = "0.1.0"
description = "Backend for Document Intelligence — a multi-tenant RAG system for financial and legal PDFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "redis[hiredis]>=5.0,<6",
    "python-dotenv>=1.0,<2",
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "unstructured>=0.14,<1",
    "openai>=1.30,<2",
    "tiktoken>=0.7,<1",
    "pyjwt[crypto]>=2.8,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
